name: CI

on:
  push:
    branches: [dev]
    tags: ['*']
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: node tools/check.mjs

  package:
    name: Store package
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Version must match the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p "require('./manifest.json').version")
          tag="${GITHUB_REF#refs/tags/}"
          if [ "$version" != "$tag" ]; then
            echo "manifest.json is $version but the tag is $tag"
            exit 1
          fi
          echo "manifest.json and the tag both say $version"

      - name: Build
        shell: pwsh
        run: ./tools/build-zip.ps1 -OutDir build -Force

      - name: Nothing private may ship
        run: |
          if unzip -Z1 build/*.zip | grep -Ei '(^|/)\.git|\.md$|playwright|remember|^LICENSE|^PRIVACY'; then
            echo "the package contains files that must not be uploaded"
            exit 1
          fi
          echo "$(unzip -Z1 build/*.zip | wc -l) files, none of them private"

      - uses: actions/upload-artifact@v7
        with:
          name: auto-vote-rating
          path: build/*.zip
          if-no-files-found: error

  publish:
    name: Chrome Web Store
    runs-on: ubuntu-latest
    needs: package
    # Only a version tag ships, and the package job has already checked it against manifest.json
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/download-artifact@v7
        with:
          name: auto-vote-rating
          path: build
      - name: Upload and submit for review
        env:
          CWS_SERVICE_ACCOUNT: ${{ secrets.CWS_SERVICE_ACCOUNT }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
        run: node tools/cws-publish.mjs build/*.zip
